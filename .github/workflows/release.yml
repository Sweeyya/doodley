# Release workflow.
# Runs on every push to main EXCEPT the version-bump commit changesets itself pushes.
#
# Two-job split (learned from tRPC and Biome):
#   build  — no credentials. Installs, builds, packs tarballs to a temp artifact.
#            If a devDependency is compromised during this step, it cannot reach npm.
#   publish — downloads the artifact, installs ONLY the release tooling with
#             --ignore-scripts so nothing executes, then publishes.
#             Gated behind environment: npm-publish so a human approves first.
#
# See RELEASING.md for the one-time manual setup (npm token, environment approval).

name: Release

on:
  push:
    branches: [main]

# Zero trust at workflow level; each job grants only what it needs.
permissions: {}

concurrency:
  # One release at a time. Never cancel a publish mid-flight.
  group: release
  cancel-in-progress: false

jobs:
  # ── Build (no credentials) ─────────────────────────────────────────────────
  build:
    name: Build and pack
    # Skip the version-bump commit that changesets pushes after publishing.
    # Without this guard the workflow re-triggers, finds nothing to release,
    # and wastes 2 minutes. Pattern learned from tRPC.
    if: |
      !(
        startsWith(github.event.head_commit.message, 'Release packages') &&
        github.event.head_commit.author.name == 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      has_changesets: ${{ steps.changesets.outputs.has_changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/setup

      - name: Build all packages
        run: pnpm build

      - name: Check for pending changesets
        id: changesets
        shell: bash
        run: |
          # If .changeset/ has any .md files (excluding README), there are
          # unreleased changes. The publish job uses this to decide whether
          # to open a release PR or actually publish.
          count=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l | tr -d ' ')
          echo "Changeset files: $count"
          if [ "$count" -gt "0" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Publish (has credentials, gated by environment approval) ──────────────
  publish:
    name: Publish to npm
    needs: build
    # Only run if the build job ran (not skipped by the commit guard above).
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # environment: npm-publish creates a required reviewer gate in GitHub Settings.
    # A human sees "about to publish to npm" and must click Approve.
    # Set this up: repo Settings → Environments → New → "npm-publish" → add reviewers.
    # Until it is set up, the job runs without gating (the environment is simply absent).
    environment: npm-publish
    permissions:
      contents: write # push version-bump commit and tag
      pull-requests: write # open the "Release packages" PR
      id-token: write # npm provenance via OIDC (no stored token needed)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # persist-credentials needed here so changesets can push the version commit.
          persist-credentials: true

      - uses: ./.github/setup

      - name: Build (restore from previous job via Turbo cache)
        run: pnpm build

      - name: Create release PR or publish to npm
        # changesets/action v2.1.2 — SHA-pinned.
        # When there are pending changesets: opens a "Release packages" PR.
        # When that PR just merged: publishes to npm and pushes a version-bump commit.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: pnpm changeset publish
          title: "Release packages"
          commit: "Release packages"
          # createGithubReleases: create a GH release entry for each published package.
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Publish with provenance so npm shows a verified build attestation.
          NPM_CONFIG_PROVENANCE: "true"
